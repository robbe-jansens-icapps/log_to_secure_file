name: log_to_secure_file
description: "A package to save and retrieve logs securely"
version: 1.0.1
homepage: https://github.com/icapps/log_to_secure_file

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_key_value_file_storage:
    git:
      url: https://github.com/robbe-jansens-icapps/flutter_key_value_file_storage.git
      ref: feature/project-update
  flutter_secure_file_storage:
    git:
      url: https://github.com/robbe-jansens-icapps/flutter_secure_file_storage.git
      ref: feature/project-update
  flutter_secure_storage: ">=9.0.0 <11.0.0"

dev_dependencies:
  build_runner: ">=2.4.6 <3.0.0"
  flutter_lints: ">=6.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  mockito: ">=5.6.1 <6.0.0"